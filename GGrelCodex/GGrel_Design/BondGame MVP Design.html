<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BondGame · MVP design direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
  body { min-height: 100vh; overscroll-behavior: none; color: #0F0F0E; }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="tokens.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="section-system.jsx"></script>
<script type="text/babel" src="screens-entry-home.jsx"></script>
<script type="text/babel" src="screens-tasks.jsx"></script>
<script type="text/babel" src="screens-challenges.jsx"></script>
<script type="text/babel" src="screens-shop.jsx"></script>
<script type="text/babel" src="screens-spicy.jsx"></script>
<script type="text/babel" src="screens-profile.jsx"></script>

<script type="text/babel" data-presets="react">
const T = window.BG_TOKENS;

// Wrap any screen component in the PhoneFrame with a label above it
function Frame({ label, sub, tint, children }) {
  return (
    <PhoneFrame label={label} sub={sub} tint={tint}>
      {children}
    </PhoneFrame>
  );
}

function App() {
  return (
    <DesignCanvas>
      {/* ── 00 Foundation / Visual System ───────────────────────── */}
      <DesignSystemSection />

      {/* ── 01 Entry & Home ─────────────────────────────────────── */}
      <DCSection
        title="01 · Entry & home"
        subtitle="Welcome, account, pair setup, waiting, home dashboard."
      >
        <Frame label="Welcome" sub="/"><S_Welcome /></Frame>
        <Frame label="Sign up" sub="/signup"><S_SignUp /></Frame>
        <Frame label="Create pair" sub="/pair/create"><S_CreatePair /></Frame>
        <Frame label="Join pair" sub="/pair/join"><S_JoinPair /></Frame>
        <Frame label="Waiting" sub="/pair/waiting"><S_Waiting /></Frame>
        <Frame label="Pair ready" sub="/pair/ready"><S_PairReady /></Frame>
        <Frame label="Home · empty" sub="/"><S_HomeEmpty /></Frame>
        <Frame label="Home · active" sub="/"><S_HomeActive /></Frame>
        <Frame label="Reward toast" sub="/ · toast"><S_RewardToast /></Frame>
      </DCSection>

      {/* ── 02 Tasks lifecycle ──────────────────────────────────── */}
      <DCSection
        title="02 · Tasks lifecycle"
        subtitle="From create → propose → bargain → accept → progress → confirm → dispute."
      >
        <Frame label="Tasks inbox" sub="/tasks"><S_TasksInbox /></Frame>
        <Frame label="Create task" sub="/tasks/new"><S_CreateTask /></Frame>
        <Frame label="Proposed" sub="/tasks/:id"><S_TaskProposed /></Frame>
        <Frame label="Counter offer" sub="/tasks/:id/bargain"><S_CounterOffer /></Frame>
        <Frame label="Bargain chat" sub="/tasks/:id/bargain"><S_BargainChat /></Frame>
        <Frame label="Accepted" sub="/tasks/:id"><S_Accepted /></Frame>
        <Frame label="In progress" sub="/tasks/:id"><S_InProgress /></Frame>
        <Frame label="Pending confirm" sub="/tasks/:id"><S_PendingConfirm /></Frame>
        <Frame label="Confirmed" sub="/tasks/:id"><S_Confirmed /></Frame>
        <Frame label="Dispute" sub="/tasks/:id/dispute"><S_Dispute /></Frame>
        <Frame label="Exchange board" sub="/tasks/exchange"><S_Exchange /></Frame>
      </DCSection>

      {/* ── 03 Challenges ───────────────────────────────────────── */}
      <DCSection
        title="03 · Challenges"
        subtitle="Pick daily, track progress, wait for partner, weekly chain, streak saved."
      >
        <Frame label="Choose daily" sub="/challenges/choose"><S_ChooseDaily /></Frame>
        <Frame label="Today" sub="/challenges"><S_Today /></Frame>
        <Frame label="Detail" sub="/challenges/:id"><S_ChallengeDetail /></Frame>
        <Frame label="Partner pending" sub="/challenges/pending"><S_PartnerPending /></Frame>
        <Frame label="Weekly" sub="/challenges/week"><S_Weekly /></Frame>
        <Frame label="Available" sub="/challenges/available"><S_Available /></Frame>
        <Frame label="Complete" sub="/challenges/complete"><S_Complete /></Frame>
        <Frame label="Streak saved" sub="/challenges/streak"><S_StreakSaved /></Frame>
      </DCSection>

      {/* ── 04 Shop & cases ─────────────────────────────────────── */}
      <DCSection
        title="04 · Shop & cases"
        subtitle="Real rewards. Cases wrap real rewards with price-based probabilities — never cosmetic loot."
      >
        <Frame label="Shop hub" sub="/shop"><S_ShopHub /></Frame>
        <Frame label="Rewards" sub="/shop/rewards"><S_Rewards /></Frame>
        <Frame label="Reward detail" sub="/shop/rewards/:id"><S_RewardDetail /></Frame>
        <Frame label="Cases entry" sub="/shop/cases"><S_CasesEntry /></Frame>
        <Frame label="Case builder" sub="/cases/new"><S_CaseBuilder /></Frame>
        <Frame label="Add rewards" sub="/cases/new/items"><S_CaseAddRewards /></Frame>
        <Frame label="Chances" sub="/cases/new/chances"><S_CaseChances /></Frame>
        <Frame label="Case price" sub="/cases/new/price"><S_CasePrice /></Frame>
        <Frame label="Preview" sub="/cases/new/preview"><S_CasePreview /></Frame>
        <Frame label="Suspense" sub="/cases/:id/open"><S_CaseSuspense /></Frame>
        <Frame label="Reveal" sub="/cases/:id/reveal"><S_CaseReveal /></Frame>
      </DCSection>

      {/* ── 05 Spicy mode ───────────────────────────────────────── */}
      <DCSection
        title="05 · Spicy mode — private, opt-in, discreet"
        subtitle="Mutual consent. Plum/magenta accents. Content isolated from public store, profile and push copy."
      >
        <Frame label="Locked" sub="/spicy" tint="#F7F0FF"><S_SpicyLocked /></Frame>
        <Frame label="Consent" sub="/spicy/consent" tint="#F7F0FF"><S_SpicyConsent /></Frame>
        <Frame label="Waiting partner" sub="/spicy/waiting" tint="#F7F0FF"><S_SpicyWaiting /></Frame>
        <Frame label="Private room" sub="/spicy/home" tint="#F7F0FF"><S_SpicyHome /></Frame>
        <Frame label="Private rewards" sub="/spicy/rewards" tint="#F7F0FF"><S_SpicyRewards /></Frame>
        <Frame label="Create spicy reward" sub="/spicy/rewards/new" tint="#F7F0FF"><S_CreateSpicyReward /></Frame>
        <Frame label="Spicy cases" sub="/spicy/cases" tint="#F7F0FF"><S_SpicyCases /></Frame>
        <Frame label="Spicy reveal" sub="/spicy/cases/:id/reveal" tint="#F7F0FF"><S_SpicyReveal /></Frame>
        <Frame label="Privacy" sub="/spicy/privacy" tint="#F7F0FF"><S_Privacy /></Frame>
      </DCSection>

      {/* ── 06 Profile & system states ──────────────────────────── */}
      <DCSection
        title="06 · Profile & system states"
        subtitle="Pair profile, partner, album, settings, notifications, and the universal empty/offline/loading/error states."
      >
        <Frame label="Pair profile" sub="/profile"><S_PairProfile /></Frame>
        <Frame label="Partner profile" sub="/profile/partner"><S_PartnerProfile /></Frame>
        <Frame label="Album" sub="/profile/album"><S_Album /></Frame>
        <Frame label="Settings" sub="/settings"><S_Settings /></Frame>
        <Frame label="Notifications" sub="/settings/push"><S_Notifications /></Frame>
        <Frame label="Empty" sub="/tasks"><S_Empty /></Frame>
        <Frame label="Offline" sub="*"><S_Offline /></Frame>
        <Frame label="Loading" sub="*"><S_Loading /></Frame>
        <Frame label="Error" sub="*"><S_Error /></Frame>
      </DCSection>

      {/* ── Closing principles ─────────────────────────────────── */}
      <div style={{ padding: '0 60px 80px' }}>
        <div style={{
          background: T.color.ink, color: '#fff', borderRadius: 28, padding: '40px 48px',
          display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 32,
        }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.5)', letterSpacing: 1.5, textTransform: 'uppercase' }}>Principle 01</div>
            <div style={{ fontSize: 22, fontWeight: 600, marginTop: 8, letterSpacing: -0.4, lineHeight: 1.2 }}>Partners are on the same side.</div>
            <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.65)', marginTop: 10, lineHeight: 1.55 }}>Negotiation, yes. Competition, no. Copy stays warm — no guilt, no accusation.</div>
          </div>
          <div>
            <div style={{ fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.5)', letterSpacing: 1.5, textTransform: 'uppercase' }}>Principle 02</div>
            <div style={{ fontSize: 22, fontWeight: 600, marginTop: 8, letterSpacing: -0.4, lineHeight: 1.2 }}>Cases wrap real rewards.</div>
            <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.65)', marginTop: 10, lineHeight: 1.55 }}>Never cosmetic loot. Higher price = lower drop chance. Expected value shown before publish.</div>
          </div>
          <div>
            <div style={{ fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.5)', letterSpacing: 1.5, textTransform: 'uppercase' }}>Principle 03</div>
            <div style={{ fontSize: 22, fontWeight: 600, marginTop: 8, letterSpacing: -0.4, lineHeight: 1.2 }}>Spicy stays discreet.</div>
            <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.65)', marginTop: 10, lineHeight: 1.55 }}>Mutual opt-in. Neutral push copy. Isolated store, profile, album. Elegant plum — never vulgar.</div>
          </div>
        </div>
        <div style={{ fontSize: 11, color: 'rgba(60,50,40,0.5)', marginTop: 24, fontFamily: T.font.mono }}>
          BondGame · MVP v1.0 · design direction · tokens, components and 50+ screens · ready for Next.js + shadcn/ui implementation
        </div>
      </div>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
